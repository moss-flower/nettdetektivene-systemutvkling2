name: Coverage Pages

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/coverage-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-pages
  cancel-in-progress: true

jobs:
  publish-coverage:
    name: Publish Coverage Reports
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Run backend tests with JaCoCo report
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Assemble coverage site
        shell: bash
        run: |
          rm -rf site
          mkdir -p site/frontend site/backend

          cp -R frontend/coverage/. site/frontend/
          cp -R backend/target/site/jacoco/. site/backend/

          cat <<'EOF' > site/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Coverage Reports</title>
              <style>
                body {
                  font-family: Arial, sans-serif;
                  margin: 0;
                  padding: 2rem;
                  background: #f6f8fa;
                  color: #1f2328;
                }

                main {
                  max-width: 48rem;
                  margin: 0 auto;
                }

                h1 {
                  margin-bottom: 0.5rem;
                }

                p {
                  line-height: 1.5;
                }

                ul {
                  padding-left: 1.25rem;
                }

                a {
                  color: #0969da;
                }
              </style>
            </head>
            <body>
              <main>
                <h1>Coverage Reports</h1>
                <p>Latest coverage reports generated from the repository CI workflow.</p>
                <ul>
                  <li><a href="./frontend/index.html">Frontend coverage report</a></li>
                  <li><a href="./backend/index.html">Backend coverage report</a></li>
                </ul>
              </main>
            </body>
          </html>
          EOF

          touch site/.nojekyll

      - name: Publish site to gh-pages
        shell: bash
        run: |
          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages-worktree refs/remotes/origin/gh-pages
          else
            git worktree add -B gh-pages gh-pages-worktree
          fi

          shopt -s dotglob nullglob
          rm -rf gh-pages-worktree/*
          cp -R site/. gh-pages-worktree/

          cd gh-pages-worktree
          git add --all

          if git diff --cached --quiet; then
            echo "No coverage site changes to publish"
            exit 0
          fi

          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Deploy coverage for ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
