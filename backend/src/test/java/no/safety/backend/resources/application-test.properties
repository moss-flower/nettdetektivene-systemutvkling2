spring.application.name=backend-test

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
server.error.include-stacktrace=never
server.error.include-message=always
logging.level.no.safety.backend=ERROR
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=ERROR

# JWT Settings
application.security.jwt.secretKey=${JWT_SECRET_KEY:secretKey}
application.security.jwt.durationMillis=900000

# Cookie settings
application.security.cookie.name=JWT-Cookie
application.security.cookie.durationMillis=900000

logging.level.root=INFO

logging.level.org.apache.hc.client5=ERROR
logging.level.org.apache.http=ERROR
logging.level.org.springframework.web.client.RestTemplate=ERROR
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
logging.level.org.springframework=INFO

logging.level.reactor.netty.http.client=ERROR
logging.level.org.springframework.http.client=ERROR

logging.level.feign=ERROR
logging.level.com.netflix=ERROR

