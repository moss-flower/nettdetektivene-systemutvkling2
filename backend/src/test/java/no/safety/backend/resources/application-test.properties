spring.application.name=backend-test

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
server.error.include-message=always
logging.level.no.safety.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT Settings
application.security.jwt.secretKey=${JWT_SECRET_KEY:secretKey}
application.security.jwt.durationMillis=900000

# Cookie settings
application.security.cookie.name=JWT-Cookie
application.security.cookie.durationMillis=900000