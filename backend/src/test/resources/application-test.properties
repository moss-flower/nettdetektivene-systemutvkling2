spring.application.name=backend-test

# In-memory datasource for tests that only need application context.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
server.error.include-message=always
logging.level.no.safety.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT Settings
application.security.jwt.secretKey=${JWT_SECRET_KEY:EVa6kxlRqYynP5tEzN8lu/65HS/fOQSdcKz6Zykzh35RHYS1LclXeoC4B/TY8EcIe+cFqK2gwsTWs0rYNvXQOA==}
application.security.jwt.durationMillis=900000

# Cookie settings
application.security.cookie.name=JWT-Cookie
application.security.cookie.durationMillis=900000

# Disable OpenAPI/Swagger in tests to avoid loading incompatible springdoc runtime paths.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
