spring.application.name=backend

# MySQL Settings
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:DB}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Settings
application.security.jwt.secretKey=${JWT_SECRET_KEY}
application.security.jwt.durationMillis=900000
application.security.jwt.refreshDurationMillis=604800000

# Media Settings
app.media.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.media.accessKey=${MINIO_ACCESS_KEY:minioadmin}
app.media.secretKey=${MINIO_SECRET_KEY:minioadmin123}
app.media.publicBucket=${MINIO_PUBLIC_BUCKET:nettdetektivene-public}
app.media.publicBaseUrl=${MINIO_PUBLIC_BASE_URL:http://localhost:9000}

# Multipart Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cookie Settings
application.security.jwt.cookie.access.name=JWT-Cookie
application.security.jwt.cookie.access.durationMillis=900000
application.security.jwt.cookie.refresh.name=JWT-Refresh-Cookie
application.security.jwt.cookie.refresh.durationMillis=604800000

# Logging Settings
logging.level.root=DEBUG
