spring.application.name=backend

# MySQL Settings
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:DB}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Settings
application.security.jwt.secretKey=${JWT_SECRET_KEY}
application.security.jwt.durationMillis=900000
application.security.jwt.refreshDurationMillis=604800000

# Cookie Settings
application.security.jwt.cookie.access.name=JWT-Cookie
application.security.jwt.cookie.access.durationMillis=900000
application.security.jwt.cookie.refresh.name=JWT-Refresh-Cookie
application.security.jwt.cookie.refresh.durationMillis=604800000

# Argon2 Settings
application.security.crypto.argon2.memoryUsageKilobytes=12288
application.security.crypto.argon2.parallelism=1
application.security.crypto.argon2.iterations=3
application.security.crypto.argon2.saltLength=16
application.security.crypto.argon2.hashLength=32

# File System
file.storage.root=/var/nettdetektivene/uploads

# Logging Settings
logging.level.root=DEBUG
