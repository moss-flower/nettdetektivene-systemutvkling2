spring.application.name=backend

# MySQL Settings
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:DB}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Settings
application.security.jwt.secretKey=${JWT_SECRET_KEY:secretKey}
application.security.jwt.durationMillis=900000

# Cookie Settings
application.security.jwt.cookie.name=JWT-Cookie
application.security.jwt.cookie.durationMillis=900000

# File System
file.storage.root=/var/nettdetektivene/uploads
# Logging Settings
logging.level.root=DEBUG
